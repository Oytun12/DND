    <section class="filter-section">
        <div class="filter-container">
            <div class="search-box">

            </div>
            
            <div class="filters-row">
                    <div class="filter-selects-group">
                        <select id="cr-select" class="dropdown-filter">
                            <option value="all">Tüm CR'ler</option>
                            <option value="0">CR 0</option>
                            <option value="1/8">CR 1/8</option>
                            <option value="1/4">CR 1/4</option>

                            <option value="2">CR 2</option>
                            <option value="3">CR 3</option>
                            <option value="4">CR 4</option>
                            <option value="5">CR 5</option>
                            <option value="high">CR 6+</option>
                        </select>

                        <select id="type-select" class="dropdown-filter">
                            <option value="all">Tüm Türler</option>
                            <option value="aberration">Aberration (Ucube)</option>
                            <option value="beast">Beast (Hayvan)</option>
                            <option value="celestial">Celestial (Semavi)</option>
                            <option value="construct">Construct (Yapı)</option>
                            <option value="dragon">Dragon (Ejderha)</option>

                            <option value="giant">Giant (Dev)</option>
                            <option value="humanoid">Humanoid (İnsansı)</option>
                            <option value="monstrosity">Monstrosity (Canavar)</option>
                            <option value="ooze">Ooze (Balçık)</option>
                            <option value="plant">Plant (Bitki)</option>
                            <option value="undead">Undead (Ölümsüz)</option>
                        </select>

                        <select id="size-select" class="dropdown-filter">
                            <option value="all">Tüm Boyutlar</option>
                            <option value="T">Tiny (Minik)</option>
                            <option value="S">Small (Küçük)</option>
                            <option value="M">Medium (Orta)</option>
                            <option value="L">Large (Büyük)</option>
                            <option value="H">Huge (Devasa)</option>
                            <option value="G">Gargantuan (Muazzam)</option>
                        </select>

                        <select id="source-select" class="dropdown-filter">
                            <option value="all">Tüm Kaynaklar</option>
                            </select>

                    <select id="sort-select" class="dropdown-filter" style="margin-top: 10px;">

                        <option value="name-desc">İsim (Z-A)</option>
                        <option value="cr-asc">Tehlike Puanı (Düşük > Yüksek)</option>
                        <option value="cr-desc">Tehlike Puanı (Yüksek > Düşük)</option>
                        <option value="source">Kaynak Kitap (A-Z)</option>
                    </select>
