<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karakter Yaratma - Admin Paneli</title>
    <link rel="stylesheet" href="../../KarakterCreate/KarakterYaratma/styles/base.css"> 
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; padding: 20px; }
        .login-container { text-align: center; margin-top: 100px; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
        
        .user-card { background: #2a2a2a; border: 1px solid #444; border-radius: 8px; padding: 15px; }
        .user-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #555; }
        .user-info h3 { margin: 0; font-size: 1.1rem; }
        .user-info span { font-size: 0.8rem; color: #aaa; }

        .char-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .char-slot { 
            background: #333; height: 70px; border-radius: 4px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; position: relative;
            font-size: 0.7rem; text-align: center; overflow: hidden; border: 1px solid #333;
        }
        .char-slot:hover { border-color: #d32f2f; }
        .char-slot.empty { opacity: 0.3; cursor: default; border: 1px dashed #555; }
        .char-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        .char-name { 
            position: absolute; bottom: 0; width: 100%; 
            background: rgba(0,0,0,0.8); color: #fff; padding: 2px 0; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        
        .btn { padding: 10px 20px; background: #d32f2f; color: white; border: none; cursor: pointer; border-radius: 4px; font-size: 1rem; }
        .btn:hover { background: #b71c1c; }
        .loading { text-align: center; color: #888; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="adminApp">
        <div v-if="!isAdmin" class="login-container">
            <h1>Yönetici Girişi</h1>
            <p>Admin yetkisi olan hesapla giriş yapınız.</p>
            <button @click="login" class="btn">Google ile Giriş Yap</button>
        </div>

        <div v-else>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h1>Admin Paneli</h1>
                <div>
                    <span style="margin-right:10px; font-size:0.9rem; color:#aaa;">{{ currentUser?.email }}</span>
                    <button @click="logout" class="btn" style="background:#444; font-size:0.8rem;">Çıkış</button>
                </div>
            </div>
            
            <p v-if="loading" class="loading">Veriler yükleniyor...</p>
            <p v-else>Toplam Oyuncu: {{ users.length }}</p>

            <div class="dashboard">
                <div v-for="user in users" :key="user.id" class="user-card">
                    
                    <div class="user-header">
                        <img :src="user.photoURL || `https://ui-avatars.com/api/?name=${user.displayName}&background=333&color=fff`" 
                             class="user-avatar" 
                             onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=U&background=333&color=fff';">
                        
                        <div class="user-info">
                            <h3>{{ user.displayName }}</h3>
                            <span>{{ user.email }}</span>
                        </div>
                    </div>

                    <div class="char-grid">
                        <div 
                            v-for="char in user.characterList" 
                            :key="char.id" 
                            class="char-slot"
                            @click="openCharacter(user.id, char.id)"
                            title="Karakteri Aç"
                        >
                            <img :src="char.avatar || `https://ui-avatars.com/api/?name=${char.name}&background=222&color=fff`" 
                                 class="char-img"
                                 onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=C&background=222&color=fff';">
                            <span class="char-name">{{ char.name }}</span>
                        </div>

                        <div v-for="n in (6 - (user.characterList ? user.characterList.length : 0))" :key="'empty'+n" class="char-slot empty">
                            <span>Boş</span>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js" } }
    </script>
    <script type="module" src="adminPanel.js"></script>
</body>
</html>
